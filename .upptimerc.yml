# Change these
owner: imm0r
repo: MTGTC-Archive-Status

sites:
  - name: Arcanum Archive App
    url: https://imm0r.github.io/MTGTC-Archive/
  - name: Keyrune Font
    url: https://imm0r.github.io/MTGTC-Archive/assets/keyrune/keyrune.woff2
  - name: Mana Font
    url: https://imm0r.github.io/MTGTC-Archive/assets/mana/mana.woff2
  - name: Supabase API
    url: https://api.supabase.com/health

  # Karten-, Preis- und Bilddaten der App. Geprüft wird eine echte
  # Kartenabfrage statt der Startseite: sie belegt, dass nicht nur der
  # Webserver steht, sondern auch die Kartendatenbank antwortet — und genau
  # daran hängt die Sammlungsansicht. Alle fünf Minuten eine Abfrage bleibt
  # weit innerhalb dessen, worum Scryfall bittet.
  - name: Scryfall API
    url: https://api.scryfall.com/cards/named?exact=Black+Lotus

  # Combo-Erkennung und Deck-Bracket. Überwacht wird bewusst backend.… und
  # nicht commanderspellbook.com: die App ruft ausschließlich das Backend auf,
  # über die Edge Function „combos" (supabase/functions/combos/index.ts, CSB =
  # https://backend.commanderspellbook.com). Auf die Website verweist sie an
  # keiner Stelle — deren Zustand sagt über die App also nichts aus.
  # Die Abfrage ist genau die Form, die die Edge Function verwendet: ohne
  # abschließenden Schrägstrich, damit keine Weiterleitung dazwischenliegt.
  - name: Commander Spellbook API
    url: https://backend.commanderspellbook.com/variants?limit=1

  # Cardmarket steht hinter Cloudflares Botabwehr und beantwortet jede Anfrage
  # aus einem Rechenzentrum mit 403 — mit Browser-Kennung, mit Bot-Kennung und
  # ganz ohne. GitHub-Actions-Runner SIND Rechenzentrum, ein gewöhnlicher Check
  # meldete hier also dauerhaft Ausfall, ohne dass etwas kaputt wäre.
  #
  # Die 403 gilt darum als gesund: sie beweist, dass Cloudflare die Anfrage
  # annimmt und zustellt. Ein echter Ausfall bleibt trotzdem sichtbar, weil
  # Cloudflare dann 52x liefert statt 403 — nachgeprüft an cardmarket.de, das
  # tatsächlich mit 522 antwortet. 301/302 stehen mit in der Liste, weil sie
  # die Standardcodes ERSETZT: ohne sie würde eine künftige Weiterleitung als
  # Ausfall zählen.
  #
  # Die Adresse ist bewusst www.cardmarket.com/de/… — cardmarket.de ist keine
  # gültige Adresse, dort antwortet Cloudflare mit 522.
  - name: Cardmarket
    url: https://www.cardmarket.com/de/Magic
    expectedStatusCodes: [200, 301, 302, 403]

status-website:
  # Die Seite liegt unter github.io/MTGTC-Archive-Status, nicht im Wurzelpfad.
  # Ohne baseUrl exportiert Sapper <base href="/"> und lädt sein Bundle von
  # /client/… – dort liegt nichts, das Skript kam nie an und der Ladekreis
  # drehte sich ewig.
  baseUrl: /MTGTC-Archive-Status
  logoUrl: https://raw.githubusercontent.com/imm0r/MTGTC-Archive/main/logo-header.png
  name: Arcanum Archive Status
  introTitle: Uptime Monitor
  introMessage: Status page for Arcanum Archive
  navbar:
    - title: Status
      href: https://imm0r.github.io/MTGTC-Archive-Status/
    - title: GitHub
      href: https://github.com/imm0r/MTGTC-Archive
    - title: Arcanum Archive
      href: https://imm0r.github.io/MTGTC-Archive/
